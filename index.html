<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF7FA"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Comic Studio">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Comic Studio · Your worlds, together</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header"><a href="#" id="brand" aria-label="Comic Studio home"><span class="mark">C<span>✦</span></span><span>COMIC<br><b>STUDIO</b></span></a><span id="modeBadge" class="badge">OFFLINE DEMO</span></header>
<main id="app" tabindex="-1"><p class="empty">Opening your studio…</p></main>
<nav class="bottom-nav" aria-label="Main navigation"><button data-nav="library" aria-label="Library" class="active"><span>▦</span>Library</button><button data-nav="characters" aria-label="Characters"><span>♙</span>Characters</button><button data-nav="settings" aria-label="Settings"><span>⚙</span>Settings</button></nav>
<div id="notice" role="status" aria-live="polite" hidden></div>
<div id="batchStatus" role="status" aria-live="polite" hidden><div class="row between"><strong>Generating panels</strong><span id="batchCount">0/45</span></div><progress id="batchProgress" value="0" max="45"></progress><p id="batchNote" class="muted"></p><button type="button" id="batchCancel" class="secondary" data-action="cancel-batch">Cancel</button></div>
<dialog id="modal"><div id="modalContent"></div></dialog>
<dialog id="reader" aria-label="Comic reader"><div id="readerContent"></div></dialog>
<dialog id="lettering" aria-label="Speech bubble editor"><div id="letteringContent"></div></dialog>
<script type="module" src="app.js"></script>
</body></html>
